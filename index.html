<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Sales Insights Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}

header {
  padding: 20px;
  background: linear-gradient(90deg,#6366f1,#22d3ee);
  color: black;
}

.container {
  padding: 30px;
  max-width: 1100px;
  margin: auto;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: #020617;
  padding: 20px;
  border-radius: 10px;
}

.card h3 {
  margin: 0;
  color: #22d3ee;
}

button {
  padding: 12px 20px;
  border: none;
  background: #6366f1;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  opacity: .8;
}

pre {
  background: #020617;
  padding: 20px;
  border-radius: 10px;
  white-space: pre-wrap;
}

.footer {
  margin-top: 40px;
  text-align: center;
  color: #94a3b8;
}
</style>
</head>

<body>

<header>
<h2>🚀 AI Sales Insights Dashboard</h2>
<p>Powered by Flask + NVIDIA LLM</p>
</header>

<div class="container">

<div class="cards">
  <div class="card">
    <h3>Total Products</h3>
    <p>3</p>
  </div>

  <div class="card">
    <h3>Data Points</h3>
    <p>4</p>
  </div>

  <div class="card">
    <h3>Model</h3>
    <p>Mistral 7B</p>
  </div>

  <div class="card">
    <h3>Status</h3>
    <p>Local Running</p>
  </div>
</div>

<button onclick="load()">Generate AI Insights</button>

<h3 style="margin-top:30px;">📊 AI Analysis</h3>

<pre id="out">Click button to analyze sales...</pre>

</div>

<div class="footer">
</div>

<script>
async function load(){
 document.getElementById("out").innerText="Analyzing sales data...";

 let res = await fetch("/insights");
 let data = await res.json();

 document.getElementById("out").innerText=data.insights;
}
</script>

</body>
</html>
